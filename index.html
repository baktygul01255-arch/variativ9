<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Физика 9: лаборатория</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  /* Лабораторный журнал: холодный бумажный фон, графитовый текст, бирюзовый акцент. Слева список уроков, справа рабочая область. */
  --paper:#f2f5f7; --card:#ffffff; --ink:#18242f; --muted:#5a6a78; --line:#d3dce3; --soft:#e8eef2;
  --accent:#0d6b6f; --accent-2:#0a4f52; --on-accent:#ffffff; --tint:#dff0f0;
  --good:#1d7a4b; --warn:#a85d00; --bad:#b3261e; --canvas:#fbfdfe;
  --c1:#0d6b6f; --c2:#c2410c; --c3:#5b4bb7; --c4:#8a6d00; --grid:#dde5eb;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11181e; --card:#18222b; --ink:#e7eef3; --muted:#9bacb9; --line:#2b3a46; --soft:#1f2c36;
  --accent:#4fc3c7; --accent-2:#7fd6d9; --on-accent:#08272a; --tint:#17363a;
  --good:#5fd08f; --warn:#f0a35b; --bad:#ff8a80; --canvas:#141d25;
  --c1:#4fc3c7; --c2:#ff9a62; --c3:#a99bff; --c4:#e3c24d; --grid:#26343f; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#11181e; --card:#18222b; --ink:#e7eef3; --muted:#9bacb9; --line:#2b3a46; --soft:#1f2c36;
  --accent:#4fc3c7; --accent-2:#7fd6d9; --on-accent:#08272a; --tint:#17363a;
  --good:#5fd08f; --warn:#f0a35b; --bad:#ff8a80; --canvas:#141d25;
  --c1:#4fc3c7; --c2:#ff9a62; --c3:#a99bff; --c4:#e3c24d; --grid:#26343f; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:19px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr;height:100%}
.top{grid-column:1/3;display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.2px;font-size:20px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.spacer{flex:1}
.side{overflow:auto;padding:10px 10px 24px;border-right:1px solid var(--line);background:var(--card)}
.q-h{margin:14px 6px 6px;font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;justify-content:space-between}
.lesson{display:grid;grid-template-columns:28px 1fr 12px;gap:8px;align-items:start;width:100%;text-align:left;border:1px solid transparent;background:none;padding:7px 8px;border-radius:8px;cursor:pointer}
.lesson:hover{background:var(--soft)}
.lesson[aria-current="true"]{background:var(--tint);border-color:var(--accent)}
.lesson .n{font-family:var(--f-mono);color:var(--muted);font-size:16.2px;padding-top:1px}
.lesson .t{font-size:16.9px;line-height:1.35}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--line)}
.dot.e{background:var(--c2)} .dot.p{background:var(--c1)}
.dot.filled{outline:2px solid var(--good)}
.main{overflow:auto;padding:18px 22px 60px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:27.5px;line-height:1.25;margin:0 0 4px;text-wrap:balance}
h2{font-size:21.2px;margin:22px 0 8px;text-wrap:balance}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px;color:var(--muted);font-size:16.2px}
.pill{border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--card)}
.pill.e{border-color:var(--c2);color:var(--c2)} .pill.p{border-color:var(--c1);color:var(--c1)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:10px 0 16px}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:600}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.rq{border-left:4px solid var(--accent);background:var(--tint);padding:10px 14px;border-radius:0 8px 8px 0}
.rq b{display:block;font-size:15px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-2);margin-bottom:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
table.plan,table.data{border-collapse:collapse;width:100%;font-size:16.9px}
table.plan th,table.plan td,table.data th,table.data td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
table.plan th,table.data th{background:var(--soft);font-weight:600}
table.plan td p{margin:0 0 5px}
.hd td:first-child{width:24%;background:var(--soft);font-weight:600}
.scroll{overflow-x:auto}
ol.steps{margin:6px 0 0;padding-left:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line)}
ol.steps li::before{content:counter(s);font-family:var(--f-mono);color:var(--accent);font-weight:600}
ol.steps li label{display:flex;gap:8px;cursor:pointer}
.sim{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px;margin:0 0 14px}
.sim h3{margin:0 0 8px;font-size:18.8px}
.sim canvas{width:100%;height:auto;display:block;border-radius:6px;background:var(--canvas);border:1px solid var(--line);touch-action:none}
.ctls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;margin-top:10px}
.ctl{display:flex;flex-direction:column;gap:2px;min-width:150px;font-size:16.2px}
.ctl label{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.ctl label b{font-family:var(--f-mono);color:var(--ink);font-weight:500}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl select{padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);max-width:260px}
.rd{display:flex;flex-direction:column;font-size:16.2px;min-width:90px}
.rd span{color:var(--muted)} .rd b{font-family:var(--f-mono);font-weight:600}
.chk{display:flex;gap:6px;align-items:center;font-size:16.2px;cursor:pointer}
.btn{border:1px solid var(--accent);background:var(--card);color:var(--accent);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--tint)}
.btn.pri{background:var(--accent);color:var(--on-accent)} .btn.pri:hover{background:var(--accent-2)}
.btn.sm{padding:3px 9px;font-size:16.2px}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.note{font-size:16.2px;color:var(--muted)}
.tool{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
table.data input{width:100%;min-width:64px;border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--card);font-family:var(--f-mono);font-size:16.2px}
table.data td.calc{background:var(--soft);font-family:var(--f-mono);font-size:16.2px;color:var(--accent-2)}
table.data tr.avg td{background:var(--tint);font-family:var(--f-mono);font-weight:600}
table.data td.rn{width:36px;color:var(--muted);font-family:var(--f-mono);text-align:center}
textarea.concl{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card);resize:vertical}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;font-size:16.2px;max-width:320px;z-index:9;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.reveal{margin-top:6px}
.sel-side{display:none}
@media(max-width:820px){
 .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
 .top{grid-column:1}
 .side{display:none;max-height:45vh;border-right:0;border-bottom:1px solid var(--line)}
 .side.open{display:block}
 .sel-side{display:inline-block}
 .main{padding:14px 14px 60px}
}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<script>const DATA=[{"code": "9B", "lang": "ru", "name": "9 «Б» · Физика в задачах", "lessons": [{"n": 1, "t": "Равномерное и равноускоренное движение", "ty": "П", "q": "Как по таблице координат x(t) отличить равномерное движение от равноускоренного и найти ускорение?", "h": "При равноускоренном движении перемещения за равные промежутки времени растут на одну и ту же величину.", "eq": "Наклонная доска, шарик или машинка, линейка, секундомер или смартфон (видео), таблица для записи.", "r": "Признак равноускоренного движения: разности перемещений за равные промежутки времени постоянны, a = (Δx₂ − Δx₁)/T²; два способа дают близкие значения a.", "steps": ["Группа запускает шарик по доске и снимает показания: положение шарика через равные интервалы T (например, 0,5 с) по видео или секундомеру.", "Вычисляет перемещения Δx за каждый интервал и их разности; сравнивает: разности постоянны? Если да, a = Δ(Δx)/T².", "Находит ускорение вторым способом: из x = at²/2 по одной паре (t, x); сравнивает два значения a.", "Решает три задачи (встреча, обгон, торможение до остановки), обосновывая выбор модели."], "hook": "Показываю видео: два автомобиля трогаются со светофора. По кадрам видно положения, но не скорости. Как понять, у кого скорость постоянна, а кто разгоняется?", "head": [["Раздел", "Виды движения"], ["Тема урока", "Равномерное и равноускоренное движение"], ["Тип и форма урока", "Решение проблемных задач · групповая исследовательская работа"], ["Цели обучения в соответствии с учебной программой", "Применять законы кинематики для описания равномерного, равноускоренного и криволинейного движения; измерять кинематические величины и оценивать погрешность."], ["Цели урока", "Научиться выбирать модель движения (равномерное / равноускоренное) по данным наблюдения и решать комбинированные задачи."], ["Критерии успеха", ["Ученик:", "• формулирует гипотезу и составляет план исследования;", "• вычисляет разности перемещений за равные интервалы и определяет тип движения", "• находит ускорение двумя способами и сравнивает результаты", "• делает вывод, опираясь на полученные данные, и представляет результат группы."]]], "stages": [{"st": "Начало урока\n(0–5 мин)", "te": ["Приветствует учащихся, проверяет готовность и состав групп (1 мин).", "Создаёт проблемную ситуацию (слова учителя): Показываю видео: два автомобиля трогаются со светофора. По кадрам видно положения, но не скорости. Как понять, у кого скорость постоянна, а кто разгоняется? (2 мин)", "Вместе с учащимися формулирует исследовательский вопрос и гипотезу, знакомит с целями и критериями успеха (2 мин)."], "su": ["Настраиваются на работу, садятся в группы по 3–4 человека, распределяют роли.", "Высказывают предположения; формулируют вопрос «Как по таблице координат x(t) отличить равномерное движение от равноускоренного и найти ускорение?» и гипотезу: При равноускоренном движении перемещения за равные промежутки времени растут на одну и ту же величину.", "Записывают цель и критерии успеха в рабочий лист."], "as_": ["Формативное: устная обратная связь учителя; «Большой палец» (готовность к работе)."], "re": ["Презентация или видеофрагмент, карточки ролей, лист критериев."]}, {"st": "Актуализация знаний\n(5–10 мин)", "te": ["Проводит фронтальный опрос: «Чем отличаются формулы пути при равномерном и равноускоренном движении?», «Что показывает ускорение и в каких единицах оно измеряется?»", "Напоминает необходимые формулы и понятия: Повтор формул v = v₀ + at, x = x₀ + v₀t + at²/2; блиц-вопросы «какое это движение?»."], "su": ["Отвечают на вопросы, вспоминают формулы.", "Записывают в рабочий лист формулы, необходимые для исследования."], "as_": ["Формативное: фронтальный опрос, «Светофор»; комментарии учителя."], "re": ["Доска, рабочий лист."]}, {"st": "Исследовательская работа\nПланирование и инструктаж\n(10–13 мин)", "te": ["Раздаёт оборудование и рабочие листы.", "Проводит инструктаж по технике безопасности.", "Помогает составить план исследования: что измеряем, чем, сколько опытов, как записываем данные."], "su": ["Обсуждают в группе план исследования.", "Распределяют обязанности, записывают план и таблицу для данных в рабочий лист."], "as_": ["Наблюдение учителя за работой групп."], "re": ["Оборудование: Наклонная доска, шарик или машинка, линейка, секундомер или смартфон (видео), таблица для записи."]}, {"st": "Исследовательская работа\nСбор данных\n(13–23 мин)", "te": ["Консультирует группы, контролирует соблюдение техники безопасности и точность измерений.", "Задаёт наводящие вопросы, не давая готовых ответов."], "su": ["1) Группа запускает шарик по доске и снимает показания: положение шарика через равные интервалы T (например, 0,5 с) по видео или секундомеру.", "2) Вычисляет перемещения Δx за каждый интервал и их разности; сравнивает: разности постоянны? Если да, a = Δ(Δx)/T²."], "as_": ["Критериальное оценивание по дескриптору: «вычисляет разности перемещений за равные интервалы и определяет тип движения». Наблюдение по листу оценивания."], "re": ["Оборудование, рабочий лист, таблица для записи данных."]}, {"st": "Исследовательская работа\nОбработка и анализ данных\n(23–29 мин)", "te": ["Помогает с расчётами и построением графика, обращает внимание на оценку погрешности.", "Просит обосновать каждый шаг."], "su": ["3) Находит ускорение вторым способом: из x = at²/2 по одной паре (t, x); сравнивает два значения a."], "as_": ["Критериальное оценивание по дескриптору: «находит ускорение двумя способами и сравнивает результаты». Взаимопроверка расчётов внутри группы."], "re": ["Калькулятор, миллиметровая бумага, рабочий лист."]}, {"st": "Исследовательская работа\nПрименение\n(29–32 мин)", "te": ["Предлагает задания по уровням (дифференциация): базовый — по образцу; повышенный — самостоятельный поиск решения.", "Проверяет ответы по эталону."], "su": ["4) Решает три задачи (встреча, обгон, торможение до остановки), обосновывая выбор модели.", "Базовый уровень: решают задачи по образцу. Повышенный уровень: Определить, где и когда второй шарик, пущенный с задержкой 1 с, догонит первый."], "as_": ["Формативное: проверка по эталону, обратная связь учителя."], "re": ["Карточки с задачами, эталон ответов."]}, {"st": "Обсуждение и вывод\n(32–40 мин)", "te": ["Организует выступления групп (1–1,5 мин), задаёт уточняющие вопросы.", "Помогает сопоставить результаты с гипотезой, обобщает вывод."], "su": ["Группы представляют таблицу, график или расчёт; сравнивают результат с гипотезой.", "Формулируют вывод: Признак равноускоренного движения: разности перемещений за равные промежутки времени постоянны, a = (Δx₂ − Δx₁)/T²; два способа дают близкие значения a."], "as_": ["Взаимооценивание «Две звезды и пожелание»; оценка учителя по критериям защиты."], "re": ["Рабочие листы, доска или проектор, лист взаимооценивания."]}, {"st": "Конец урока\n(40–45 мин)", "te": ["Возвращается к исследовательскому вопросу, подводит итоги урока.", "Организует рефлексию, выставляет оценки по критериям."], "su": ["Проводят рефлексию: «Что исследовали? Что получилось? Что вызвало затруднение? Что хотелось бы исследовать дальше?»", "Оценивают свою работу по критериям успеха."], "as_": ["Самооценка «Лестница успеха»; суммативное выставление баллов по критериям."], "re": ["Стикеры, лист рефлексии."]}], "tables": [{"t": "Положения тела x(t)", "cols": [{"h": "t, с", "key": "t", "calc": null, "text": false, "dec": 3}, {"h": "x, см", "key": "x", "calc": null, "text": false, "dec": 3}, {"h": "Δx за интервал, см", "key": null, "calc": null, "text": false, "dec": 3}, {"h": "a = 2x/t², см/с²", "key": null, "calc": "2*c2/(c1*c1)", "text": false, "dec": 3}]}], "sims": ["kin"], "topic": "kin", "q_no": 1}, {"n": 2, "t": "Графики скорости и ускорения", "ty": "П", "q": "Что можно узнать о движении, если известен только график v(t)?", "h": "По графику скорости можно найти ускорение (наклон) и перемещение (площадь под графиком).", "eq": "Карточки с графиками, миллиметровая бумага, линейки; по возможности смартфон с приложением Phyphox.", "r": "Наклон графика v(t) рав  "Исследовать действие сил (тяжести, упругости, трения) и давление; определять силы, центр тяжести и давление экспериментально и расчётом."], ["Цели урока", "Измерить жёсткость пружин и выяснить, как она зависит от длины и материала."], ["Критерии успеха", ["Ученик:", "• формулирует гипотезу и составляет план исследования;", "• измеряет k для нескольких пружин по графику", "• делает вывод о зависимости k от длины и материала", "• делает вывод, опираясь на полученные данные, и представляет результат группы."]]], "stages": [{"st": "Начало урока\n(0–5 мин)", "te": ["Приветствует учащихся, проверяет готовность и состав групп (1 мин).", "Создаёт проблемную ситуацию (слова учителя): Амортизатор велосипеда и пружина в ручке: одни «мягкие», другие «жёсткие». От чего это зависит — от длины, от толщины, от материала? (2 мин)", "Вместе с учащимися формулирует исследовательский вопрос и гипотезу, знакомит с целями и критериями успеха (2 мин)."], "su": ["Настраиваются на работу, садятся в группы по 3–4 человека, распределяют роли.", "Высказывают предположения; формулируют вопрос «Как жёсткость пружины зависит от числа витков (длины) и от материала проволоки?» и гипотезу: Чем короче пружина (меньше витков), тем она жёстче.", "Записывают цель и критерии успеха в рабочий лист."], "as_": ["Формативное: устная обратная связь учителя; «Большой палец» (готовность к работе)."], "re": ["Презентация или видеофрагмент, карточки ролей, лист критериев."]}, {"st": "Актуализация знаний\n(5–10 мин)", "te": ["Проводит фронтальный опрос: «Что показывает жёсткость пружины?», «Как найти жёсткость из графика F(Δl)?»", "Напоминает необходимые формулы и понятия: Закон Гука, единицы k, правила работы с пружинами."], "su": ["Отвечают на вопросы, вспоминают формулы.", "Записывают в рабочий лист формулы, необходимые для исследования."], "as_": ["Формативное: фронтальный опрос, «Светофор»; комментарии учителя."], "re": ["Доска, рабочий лист."]}, {"st": "Исследовательская работа\nПланирование и инструктаж\n(10–13 мин)", "te": ["Раздаёт оборудование и рабочие листы.", "Проводит инструктаж по технике безопасности.", "Помогает составить план исследования: что измеряем, чем, сколько опытов, как записываем данные."], "su": ["Обсуждают в группе план исследования.", "Распределяют обязанности, записывают план и таблицу для данных в рабочий лист."], "as_": ["Наблюдение учителя за работой групп."], "re": ["Оборудование: Две-три пружины разной длины или материала (или одна пружина, зажатая на половине витков), грузы, штатив, линейка."]}, {"st": "Исследовательская работа\nСбор данных\n(13–23 мин)", "te": ["Консультирует группы, контролирует соблюдение техники безопасности и точность измерений.", "Задаёт наводящие вопросы, не давая готовых ответов."], "su": ["1) Для каждой пружины измеряют начальную длину и удлинения при нагрузке 1–4 грузами; строят график и находят k.", "2) Сравнивают k целой пружины и такой же пружины с вдвое меньшим числом витков."], "as_": ["Критериальное оценивание по дескриптору: «измеряет k для нескольких пружин по графику». Наблюдение по листу оценивания."], "re": ["Оборудование, рабочий лист, таблица для записи данных."]}, {"st": "Исследовательская работа\nОбработка и анализ данных\n(23–29 мин)", "te": ["Помогает с расчётами и построением графика, обращает внимание на оценку погрешности.", "Просит обосновать каждый шаг."], "su": ["3) Сравнивают пружины разного материала (стальная, медная) при одинаковых размерах (если есть)."], "as_": ["Критериальное оценивание по дескриптору: «делает вывод о зависимости k от длины и материала». Взаимопроверка расчётов внутри группы."], "re": ["Калькулятор, миллиметровая бумага, рабочий лист."]}, {"st": "Исследовательская работа\nПрименение\n(29–32 мин)", "te": ["Предлагает задания по уровням (дифференциация): базовый — по образцу; повышенный — самостоятельный поиск решения.", "Проверяет ответы по эталону."], "su": ["4) Делают вывод о зависимости k от длины и материала.", "Базовый уровень: решают задачи по образцу. Повышенный уровень: Рассчитать, во сколько раз изменится жёсткость, если пружину разделить на три равные части."], "as_": ["Формативное: проверка по эталону, обратная связь учителя."], "re": ["Карточки с задачами, эталон ответов."]}, {"st": "Обсуждение и вывод\n(32–40 мин)", "te": ["Организует выступления групп (1–1,5 мин), задаёт уточняющие вопросы.", "Помогает сопоставить результаты с гипотезой, обобщает вывод."], "su": ["Группы представляют таблицу, график или расчёт; сравнивают результат с гипотезой.", "Формулируют вывод: Жёсткость обратно пропорциональна числу витков (длине): половина пружины жёстче примерно в 2 раза; зависит от материала и толщины проволоки."], "as_": ["Взаимооценивание «Две звезды и пожелание»; оценка учителя по критериям защиты."], "re": ["Рабочие листы, доска или проектор, лист взаимооценивания."]}, {"st": "Конец урока\n(40–45 мин)", "te": ["Возвращается к исследовательскому вопросу, подводит итоги урока.", "Организует рефлексию, выставляет оценки по критериям."], "su": ["Проводят рефлексию: «Что исследовали? Что получилось? Что вызвало затруднение? Что хотелось бы исследовать дальше?»", "Оценивают свою работу по критериям успеха."], "as_": ["Самооценка «Лестница успеха»; суммативное выставление баллов по критериям."], "re": ["Стикеры, лист рефлексии."]}], "tables": [{"t": "Жёсткость пружин", "cols": [{"h": "Пружина", "key": "name", "calc": null, "text": true, "dec": 3}, {"h": "l₀, см", "key": "l0", "calc": null, "text": false, "dec": 3}, {"h": "m, г", "key": "m", "calc": null, "text": false, "dec": 3}, {"h": "Δl, см", "key": "dl", "calc": null, "text": false, "dec": 3}, {"h": "k = mg/Δl, Н/м", "key": null, "calc": "(c3*9.8/1000)/(c4/100)", "text": false, "dec": 1}]}], "sims": ["spring"], "topic": "spring_k", "q_no": 2}, {"n": 15, "t": "Измерение коэффициента трения скольжения бруска при скольжении на разных гранях", "ty": "Э", "q": "Зависит ли коэффициент трения скольжения от площади поверхности соприкосновения и от вида поверхности?", "h": "Сила трения не зависит от площади соприкосновения.", "eq": "Брусок с гранями разной площади, динамометр, набор грузов, поверхности (стол, наждачная бумага, ткань), доска с транспортиром.", "r": "μ практически не зависит от площади грани, зависит от материала и качества поверхностей; μ = Fтр/N = tg α при равномерном скольжении.", "steps": ["Равномерно тянут брусок динамометром по столу по трём граням, записывают Fтр; вычисляют μ = Fтр/(mg).", "Повторяют, положив на брусок груз (N ↑), для одной грани.", "Меняют поверхность (стол, бумага, ткань), сравнивают μ.", "По углу, при котором брусок начинает скользить по наклонной доске, находят μ = tg α и сравнивают."], "hook": "Санки скользят по снегу легко, а по асфальту — нет. Зависит ли сила трения от того, какой стороной положить брусок?", "head": [["Раздел", "Силы. Давление"], ["Тема урока", "Измерение коэффициента трения скольжения бруска при скольжении на разных гранях"], ["Тип и форма урока", "Решение экспериментальных задач · групповая исследовательская работа"], ["Цели обучения в соответствии с учебной программой", "Исследовать действие сил (тяжести, упругости, трения) и давление; определять силы, центр тяжести и давление экспериментально и расчётом."], ["Цели урока", "Измерить μ и проверить, зависит ли сила трения от площади соприкосновения."], ["Критерии успеха", ["Ученик:", "• формулирует гипотезу и составляет план исследования;", "• измеряет силу трения для трёх граней и делает вывод о влиянии площади", "• определяет μ для разных поверхностей", "• делает вывод, опираясь на полученные данные, и представляет результат группы."]]], "stages": [{"st": "Начало урока\n(0–5 мин)", "te": ["Приветствует учащихся, проверяет готовность и состав групп (1 мин).", "Создаёт проблемную ситуацию (слова учителя): Санки скользят по снегу легко, а по асфальту — нет. Зависит ли сила трения от того, какой стороной положить брусок? (2 мин)", "Вместе с учащимися формулирует исследовательский вопрос и гипотезу, знакомит с целями и критериям re": ["Стикеры, лист рефлексии."]}], "tables": [{"t": "Цепочка распада", "cols": [{"h": "Ядро", "key": "name", "calc": null, "text": true, "dec": 3}, {"h": "A₀", "key": "A0", "calc": null, "text": false, "dec": 3}, {"h": "Z₀", "key": "Z0", "calc": null, "text": false, "dec": 3}, {"h": "α-распадов", "key": "na", "calc": null, "text": false, "dec": 3}, {"h": "β⁻-распадов", "key": "nb", "calc": null, "text": false, "dec": 3}, {"h": "A конечное", "key": null, "calc": "c2-4*c4", "text": false, "dec": 0}, {"h": "Z конечное", "key": null, "calc": "c3-2*c4+c5", "text": false, "dec": 0}]}], "sims": ["decay"], "topic": "decay", "q_no": 4}]}, {"code": "9A", "lang": "kk", "name": "9 «А» · Эксперименталды физика", "lessons": [{"n": 1, "t": "Бірқалыпты қозғалыс. Теңүдемелі қозғалыс. Үдеу", "ty": "П", "q": "x(t) координаталар кестесі бойынша бірқалыпты қозғалысты теңүдемелі қозғалыстан қалай ажыратып, үдеуді қалай табамыз?", "h": "Теңүдемелі қозғалыста тең уақыт аралықтарындағы орын ауыстырулар бірдей шамаға артады.", "eq": "Көлбеу тақтай, шарик немесе машинка, сызғыш, секундомер немесе смартфон (бейне), жазба кестесі.", "r": "Теңүдемелі қозғалыс белгісі: тең уақыт аралықтарындағы орын ауыстырулардың айырмасы тұрақты, a = (Δx₂ − Δx₁)/T²; екі тәсіл жуық мән береді.", "steps": ["Топ шарикті тақтай бойымен жібереді және тең T аралықтарынан (мысалы, 0,5 с) кейінгі орнын бейне немесе секундомер арқылы жазады.", "Әр аралықтағы Δx орын ауыстыруларын және олардың айырмасын есептейді; салыстырады: айырмалар тұрақты ма? Иә болса, a = Δ(Δx)/T².", "Үдеуді екінші тәсілмен табады: x = at²/2 формуласынан бір (t, x) жұбы бойынша; екі a мәнін салыстырады.", "Үш есепті (кездесу, қуып жету, тоқтағанша тежелу) қозғалыс моделін негіздеп шығарады."], "hook": "Бейне көрсетемін: екі автомобиль бағдаршамнан қозғалады. Кадрлардан орындары көрінеді, бірақ жылдамдықтары көрінбейді. Кімнің жылдамдығы тұрақты, ал кім үдеп келеді — қалай білуге болады?", "head": [["Бөлім", "Қозғалыс түрлері"], ["Сабақтың тақырыбы", "Бірқалыпты қозғалыс. Теңүдемелі қозғалыс. Үдеу"], ["Сабақтың түрі мен формасы", "Проблемалық есептер шығару · топтық зерттеу жұмысы"], ["Оқу бағдарламасына сәйкес оқыту мақсаттары", "Бірқалыпты, теңүдемелі және қисық сызықты қозғалысты сипаттау үшін кинематика заңдарын қолдану; кинематикалық шамаларды өлшеп, қателікті бағалау."], ["Сабақтың мақсаттары", "Бақылау деректері бойынша қозғалыс моделін (бірқалыпты / теңүдемелі) таңдап, құрама есептер шығаруды үйрену."], ["Табыс критерийлері", ["Оқушы:", "• гипотеза тұжырымдайды және зерттеу жоспарын құрады;", "• тең аралықтардағы орын ауыстыру айырмаларын есептеп, қозғалыс түрін анықтайды", "• үдеуді екі тәсілмен тауып, нәтижелерді салыстырады", "• алынған деректерге сүйеніп қорытынды жасайды және топ нәтижесін ұсынады."]]], "stages": [{"st": "Сабақтың басы\n(0–5 мин)", "te": ["Оқушылармен амандасады, дайындықты және топ құрамын тексереді (1 мин).", "Проблемалық жағдай туғызады (мұғалімнің сөзі): Бейне көрсетемін: екі автомобиль бағдаршамнан қозғалады. Кадрлардан орындары көрінеді, бірақ жылдамдықтары көрінбейді. Кімнің жылдамдығы тұрақты, ал кім үдеп келеді — қалай білуге болады? (2 мин)", "Оқушылармен бірге зерттеу сұрағы мен гипотезаны тұжырымдайды, мақсаттармен және табыс критерийлерімен таныстырады (2 мин)."], "su": ["Жұмысқа дайындалады, 3–4 адамнан топқа отырады, рөлдерді бөледі.", "Болжам айтады; «x(t) координаталар кестесі бойынша бірқалыпты қозғалысты теңүдемелі қозғалыстан қалай ажыратып, үдеуді қалай табамыз?» сұрағын және гипотезаны тұжырымдайды: Теңүдемелі қозғалыста тең уақыт аралықтарындағы орын ауыстырулар бірдей шамаға артады.", "Мақсат пен табыс критерийлерін жұмыс парағына жазады."], "as_": ["Формативті: мұғалімнің ауызша кері байланысы; «Бас бармақ» (жұмысқа дайындық)."], "re": ["Презентация немесе бейнежазба, рөл карточкалары, критерийлер парағы."]}, {"st": "Білімді өзектендіру\n(5–10 мин)", "te": ["Фронталды сұрау жүргізеді: «Бірқалыпты және теңүдемелі қозғалыстағы жол формулалары немен ерекшеленеді?», «Үдеу нені көрсетеді және қандай бірлікпен өлшенеді?»", "Қажетті формулалар мен ұғымдарды еске салады: v = v₀ + at, x = x₀ + v₀t + at²/2 формулаларын еске түсіру; «бұл қандай қозғалыс?» блиц-сұрақтары."], "su": ["Сұрақтарға жауап береді, формулаларды еске түсіреді.", "Зерттеуге қажетті формулаларды жұмыс парағына жазады."], "as_": ["Формативті: фронталды сұрау, «Бағдаршам»; мұғалімнің пікірі."], "re": ["Тақта, жұмыс парағы."]}, {"st": "Зерттеу жұмысы\nЖоспарлау және нұсқаулық\n(10–13 мин)", "te": ["Жабдықты және жұмыс парақтарын таратады.", "Қауіпсіздік техникасы бойынша нұсқау береді.", "Зерттеу жоспарын құруға көмектеседі: нені, немен өлшейміз, неше тәжірибе, деректерді қалай жазамыз."], "su": ["Топта зерттеу жоспарын талқылайды.", "Міндеттерді бөліп, жоспар мен деректер кестесін жұмыс парағына жазады."], "as_": ["Мұғалімнің топтар жұмысын бақылауы."], "re": ["Жабдық: Көлбеу тақтай, шарик немесе машинка, сызғыш, секундомер немесе смартфон (бейне), жазба кестесі."]}, {"st": "Зерттеу жұмысы\nДеректер жинау\n(13–23 мин)", "te": ["Топтарға кеңес береді, қауіпсіздік техникасының сақталуын және өлшеу дәлдігін бақылайды.", "Дайын жауап бермей, жетелеуші сұрақтар қояды."], "su": ["1) Топ шарикті тақтай бойымен жібереді және тең T аралықтарынан (мысалы, 0,5 с) кейінгі орнын бейне немесе секундомер арқылы жазады.", "2) Әр аралықтағы Δx орын ауыстыруларын және олардың айырмасын есептейді; салыстырады: айырмалар тұрақты ма? Иә болса, a = Δ(Δx)/T²."], "as_": ["Дескриптор бойынша критериалды бағалау: «тең аралықтардағы орын ауыстыру айырмаларын есептеп, қозғалыс түрін анықтайды». Бағалау парағы бойынша бақылау."], "re": ["Жабдық, жұмыс парағы, деректерді жазу кестесі."]}, {"st": "Зерттеу жұмысы\nДеректерді өңдеу және талдау\n(23–29 мин)", "te": ["Есептеуге және график салуға көмектеседі, қателікті бағалауға назар аударады.", "Әр қадамды негіздеуді сұрайды."], "su": ["3) Үдеуді екінші тәсілмен табады: x = at²/2 формуласынан бір (t, x) жұбы бойынша; екі a мәнін салыстырады."], "as_": ["Дескриптор бойынша критериалды бағалау: «үдеуді екі тәсілмен тауып, нәтижелерді салыстырады». Топ ішінде есептеулерді өзара тексеру."], "re": ["Калькулятор, миллиметрлік қағаз, жұмыс парағы."]}, {"st": "Зерттеу жұмысы\nҚолдану\n(29–32 мин)", "te": ["Деңгейлер бойынша тапсырмалар ұсынады (саралау): базалық — үлгі бойынша; жоғары — өз бетінше шешім іздеу.", "Жауаптарды эталон бойынша тексереді."], "su": ["4) Үш есепті (кездесу, қуып жету, тоқтағанша тежелу) қозғалыс моделін негіздеп шығарады.", "Базалық деңгей: есептерді үлгі бойынша шығарады. Жоғары деңгей: 1 с кідіріспен жіберілген екінші шарик біріншіні қайда және қашан қуып жететінін анықтау."], "as_": ["Формативті: эталон бойынша тексеру, мұғалімнің кері байланысы."], "re": ["Есеп карточкалары, жауаптар эталоны."]}, {"st": "Талқылау және қорытынды\n(32–40 мин)", "te": ["Топтардың баяндамасын ұйымдастырады (1–1,5 мин), нақтылаушы сұрақтар қояды.", "Нәтижені гипотезамен салыстыруға көмектеседі, қорытындыны жинақтайды."], "su": ["Топтар кестені, графикті немесе есептеуді таныстырады; нәтижені гипотезамен салыстырады.", "Қорытынды тұжырымдайды: Теңүдемелі қозғалыс белгісі: тең уақыт аралықтарындағы орын ауыстырулардың айырмасы тұрақты, a = (Δx₂ − Δx₁)/T²; екі тәсіл жуық мән береді."], "as_": ["«Екі жұлдыз және тілек» өзара бағалау; қорғау критерийлері бойынша мұғалімнің бағасы."], "re": ["Жұмыс парақтары, тақта немесе проектор, өзара бағалау парағы."]}, {"st": "Сабақтың соңы\n(40–45 мин)", "te": ["Зерттеу сұрағына оралады, сабақ қорытындысын шығарады.", "Рефлексия ұйымдастырады, критерийлер бойынша баға қояды."], "su": ["Рефлексия жасайды: «Нені зерттедік? Не шықты? Не қиындық туғызды? Әрі қарай нені зерттегіңіз келеді?»", "Өз жұмысын табыс критерийлері бойынша бағалайды."], "as_": ["«Табыс баспалдағы» өзін-өзі бағалау; критерийлер бойынша баллдарды қою."], "re": ["Стикерлер, рефлексия парағы."]}], "tables": [{"t": "x(t) орындары", "cols": [{"h": "t, с", "key": "t", "calc": null, "text": false, "dec": 3}, {"h": "x, см", "key": "x", "calc": null, "text": false, "dec": 3}, {"h": "Интервалдағы Δx, см", "key": null, "calc": null, "text": false, "dec": 3}, {"h": "a = 2x/t², см/с²", "key": null, "calc": "2*c2/(c1*c1)", "text": false, "dec": 3}]}], "sims": ["kin"], "topic": "kin", "q_no": 1}, {"n": 2, "t": "Еркін құлау үдеуі. Еркін құлау", "ty": "П", "q": "Құлау уақыты дене массасына тәуелді ме және құлау уақыты бойынша g мен биіктікті қалай табуға болады?", "h": "Ауаның кедергісі болмаса, барлық денелер бірдей үдеумен құлайды.", "eq": "Массасы әртүрлі екі шарик, қағаз (жазық және мыжылған), рулетка, баяу түсіру режимді смартфон.", "r": "Ауа кедергісі болмағанда құлау уақыты массаға тәуелсіз; g ≈ 9,8 м/с²; мыжылған және жазық қағаздың айырмасы ауа кедергісінен туады.", "steps": ["Массасы әртүрлі шариктерді бір биіктіктен бір мезгілде жібереді; кейін жазық және мыжылған қағазды; нәтижені бейнеге түсіреді.", "2–3 м биіктіктен шариктің құлау уақытын (5 тәжірибе, баяу бейне бойынша) өлшеп, g = 2h/t² және орташа мәнін есептейді.", "Қателікті бағалап, 9,8 м/с² мәнімен салыстырады; ауытқу себептерін талқылайды.", "Есептер шығарады: тас құлау уақыты бойынша құдық тереңдігі, соғылу кездегі жылдамдық, соңғы секундтағы жол."], "hook": "Дәптерді және мыжылған парақты бір мезгілде тастаймын. Олар дерлік бірдей түседі. Ендеше парашютші неге баяу түседі, ал вакуумда мамық пен жаңғақ бірдей түседі?", "head": [["Бөлім", "Қозғалыс түрлері"], ["Сабақтың тақырыбы", "Еркін құлау үдеуі. Еркін құлау"], ["Сабақтың түрі мен формасы", "Проблемалық есептер шығару · топтық зерттеу жұмысы"], ["Оқу бағдарламасына сәйкес оқыту мақсаттары", "Бірқалыпты, теңүдемелі және қисық сызықты қозғалысты сипаттау үшін кинематика заңдарын қолдану; кинематикалық шамаларды өлшеп, қателікті бағалау."], ["Сабақтың мақсаттары", "Дененің құлау уақыты оның массасы мен пішініне тәуелділігін зерттеп, еркін құлауға есептер шығаруды үйрену."], ["Табыс критерийлері", ["Оқушы:", "• гипотеза тұжырымдайды және зерттеу жоспары  (трапеция немесе үшбұрыш ауданы бойынша) анықтайды."], "as_": ["Дескриптор бойынша критериалды бағалау: «v(t) графигінің көлбеуі бойынша үдеуді анықтайды». Бағалау парағы бойынша бақылау."], "re": ["Жабдық, жұмыс парағы, деректерді жазу кестесі."]}, {"st": "Зерттеу жұмысы\nДеректерді өңдеу және талдау\n(23–29 мин)", "te": ["Есептеуге және график салуға көмектеседі, қателікті бағалауға назар аударады.", "Әр қадамды негіздеуді сұрайды."], "su": ["3) Өз қозғалысы үшін миллиметрлік қағазға a(t) және x(t) графиктерін салады."], "as_": ["Дескриптор бойынша критериалды бағалау: «график астындағы ауданнан орын ауыстыруды тауып, a(t), x(t) графиктерін салады». Топ ішінде есептеулерді өзара тексеру."], "re": ["Калькулятор, миллиметрлік қағаз, жұмыс парағы."]}, {"st": "Зерттеу жұмысы\nҚолдану\n(29–32 мин)", "te": ["Деңгейлер бойынша тапсырмалар ұсынады (саралау): базалық — үлгі бойынша; жоғары — өз бетінше шешім іздеу.", "Жауаптарды эталон бойынша тексереді."], "su": ["4) Басқа топпен жұмыстарын алмасып, бөтен график бойынша «қозғалыс тарихын» жазады; авторлар тексереді.", "Базалық деңгей: есептерді үлгі бойынша шығарады. Жоғары деңгей: x(t) графигі бойынша жылдамдық таңбасы өзгеретін v(t) графигін қалпына келтіру."], "as_": ["Формативті: эталон бойынша тексеру, мұғалімнің кері байланысы."], "re": ["Есеп карточкалары, жауаптар эталоны."]}, {"st": "Талқылау және қорытынды\n(32–40 мин)", "te": ["Топтардың баяндамасын ұйымдастырады (1–1,5 мин), нақтылаушы сұрақтар қояды.", "Нәтижені гипотезамен салыстыруға көмектеседі, қорытындыны жинақтайды."], "su": ["Топтар кестені, графикті немесе есептеуді таныстырады; нәтижені гипотезамен салыстырады.", "Қорытынды тұжырымдайды: v(t) графигінің көлбеуі үдеуге, график астындағы аудан орын ауыстыруға тең (таңбасын ескеріп); бір график бойынша қалған екеуі салынады."], "as_": ["«Екі жұлдыз және тілек» өзара бағалау; қорғау критерийлері бойынша мұғалімнің бағасы."], "re": ["Жұмыс парақтары, тақта немесе проектор, өзара бағалау парағы."]}, {"st": "Сабақтың соңы\n(40–45 мин)", "te": ["Зерттеу сұрағына оралады, сабақ қорытындысын шығарады.", "Рефлексия ұйымдастырады, критерийлер бойынша баға қояды."], "su": ["Рефлексия жасайды: «Нені зерттедік? Не шықты? Не қиындық туғызды? Әрі қарай нені зерттегіңіз келеді?»", "Өз жұмысын табыс критерийлері бойынша бағалайды."], "as_": ["«Табыс баспалдағы» өзін-өзі бағалау; критерийлер бойынша баллдарды қою."], "re": ["Стикерлер, рефлексия парағы."]}], "tables": [{"t": "v(t) графигінің бөліктері", "cols": [{"h": "Бөлік", "key": "seg", "calc": null, "text": true, "dec": 3}, {"h": "Δv, м/с", "key": "dv", "calc": null, "text": false, "dec": 3}, {"h": "Δt, с", "key": "dt", "calc": null, "text": false, "dec": 3}, {"h": "a = Δv/Δt, м/с²", "key": null, "calc": "c2/c3", "text": false, "dec": 3}, {"h": "s (аудан), м", "key": "s", "calc": null, "text": false, "dec": 3}]}], "sims": ["graphs"], "topic": "graphs", "q_no": 1}, {"n": 4, "t": "Дененің тұрақты жылдамдықпен шеңбер бойымен қозғалысы. Период пен айналу жиілігі", "ty": "П", "q": "Шеңбер бойымен бірқалыпты қозғалғанда T, ν, v және a қалай байланысқан және үдеу неге центрге бағытталған?", "h": "Жылдамдық v = 2πR/T, үдеу a = v²/R шеңбер центріне бағытталған.", "eq": "Жіптегі жүк (өшіргіш, тығын), секундомер, сызғыш, секундтық тілшесі бар сағат.", "r": "v = 2πR/T = 2πRν; a = v²/R = 4π²R/T²; a векторы шеңбер центріне бағытталған.", "steps": ["Жіптегі жүкті R радиусты көлденең шеңбер бойымен айналдырады; 10 айналым уақытын өлшеп, T, ν, ω табады.", "Басқа радиуспен қайталап, v = 2πR/T есептейді; жылдамдықтарды салыстырады.", "Суретте екі нүктедегі v₁ және v₂ векторларын және Δv = v₂ − v₁ векторын салып, a бағыты туралы қорытынды жасайды.", "Есептер шығарады: дөңгелек, минуттық тілше ұшы, жер серігі, Жердің экватордағы нүктелері."], "hook": "Тез айналатын дискіні көрсетемін: барлық нүктелердің жылдамдығы модулі бойынша тұрақты, бірақ диск «сыртқа ұмтылады». Жылдамдық өзгермесе, үдеу қайдан шығады?", "head": [["Бөлім", "Қозғалыс түрлері"], ["Сабақтың тақырыбы", "Дененің тұрақты жылдамдықпен шеңбер бойымен қозғалысы. Период пен айналу жиілігі"], ["Сабақтың түрі мен формасы", "Проблемалық есептер шығару · топтық зерттеу жұмысы"], ["Оқу бағдарламасына сәйкес оқыту мақсаттары", "Бірқалыпты, теңүдемелі және қисық сызықты қозғалысты сипаттау үшін кинематика заңдарын қолдану; кинематикалық шамаларды өлшеп, қателікті бағалау."], ["Сабақтың мақсаттары", "Период, жиілік, сызықтық жылдамдық және центрге тартқыш үдеу арасындағы байланысты анықтау."], ["Табыс критерийлері", ["Оқушы:", "• гипотеза тұжырымдайды және зерттеу жоспарын құрады;", "• бірнеше айналым уақыты бойынша айналу периодын өлшейді", "• жылдамдық пен үдеуді есептеп, үдеу бағытын негіздейді", "• алынған деректерге сүйеніп қорытынды жасайды және топ нәтижесін ұсынады."]]], "stages": [{"st": "Сабақтың басы\n(0–5 мин)", "te": ["Оқушылармен амандасады, дайындықты және топ құрамын тексереді (1 мин).", "Проблемалық жағдай туғызады (мұғалімнің сөзі): Тез айналатын дискіні көрсетемін: барлық нүктелердің жылдамдығы модулі бойынша тұрақты, бірақ диск «сыртқа ұмтылады». Жылдамдық өзгермесе, үдеу қайдан шығады? (2 мин)", "Оқушылармен бірге зерттеу сұрағы мен гипотезаны тұжырымдайды, мақсаттармен және табыс критерийлерімен таныстырады (2 мин)."], "su": ["Жұмысқа дайындалады, 3–4 адамнан топқа отырады, рөлдерді бөледі.", "Болжам айтады; «Шеңбер бойымен бірқалыпты қозғалғанда T, ν, v және a қалай байланысқан және үдеу неге центрге бағытталған?» сұрағын және гипотезаны тұжырымдайды: Жылдамдық v = 2πR/T, үдеу a = v²/R шеңбер центріне бағытталған.", "Мақсат пен табыс критерийлерін жұмыс парағына жазады."], "as_": ["Формативті: мұғалімнің ауызша кері байланысы; «Бас бармақ» (жұмысқа дайындық)."], "re": ["Презентация немесе бейнежазба, рөл карточкалары, критерийлер парағы."]}, {"st": "Білімді өзектендіру\n(5–10 мин)", "te": ["Фронталды сұрау жүргізеді: «Период және жиілік дегеніміз не және олар қалай байланысқан?», «Шеңбер бойымен қозғалғанда жылдамдық векторы қалай бағытталған?»", "Қажетті формулалар мен ұғымдарды еске салады: Период, жиілік анықтамаларын және өлшем бірліктерін еске түсіру; шеңбер бойымен қозғалғанда жылдамдық қалай бағытталады."], "su": ["Сұрақтарға жауап береді, формулаларды еске түсіреді.", "Зерттеуге қажетті формулаларды жұмыс парағына жазады."], "as_": ["Формативті: фронталды сұрау, «Бағдаршам»; мұғалімнің пікірі."], "re": ["Тақта, жұмыс парағы."]}, {"st": "Зерттеу жұмысы\nЖоспарлау және нұсқаулық\n(10–13 мин)", "te": ["Жабдықты және жұмыс парақтарын таратады.", "Қауіпсіздік техникасы бойынша нұсқау береді.", "Зерттеу жоспарын құруға көмектеседі: нені, немен өлшейміз, неше тәжірибе, деректерді қалай жазамыз."], "su": ["Топта зерттеу жоспарын талқылайды.", "Міндеттерді бөліп, жоспар мен деректер кестесін жұмыс парағына жазады."], "as_": ["Мұғалімнің топтар жұмысын бақылауы."], "re": ["Жабдық: Жіптегі жүк (өшіргіш, тығын), секундомер, сызғыш, секундтық тілшесі бар сағат."]}, {"st": "Зерттеу жұмысы\nДеректер жинау\n(13–23 мин)", "te": ["Топтарға кеңес береді, қауіпсіздік техникасының сақталуын және өлшеу дәлдігін бақылайды.", "Дайын жауап бермей, жетелеуші сұрақтар қояды."], "su": ["1) Жіптегі жүкті R радиусты көлденең шеңбер бойымен айналдырады; 10 айналым уақытын өлшеп, T, ν, ω табады.", "2) Басқа радиуспен қайталап, v = 2πR/T есептейді; жылдамдықтарды салыстырады."], "as_": ["Дескриптор бойынша критериалды бағалау: «бірнеше айналым уақыты бойынша айналу периодын өлшейді». Бағалау парағы бойынша бақылау."], "re": ["Жабдық, жұмыс парағы, деректерді жазу кестесі."]}, {"st": "Зерттеу жұмысы\nДеректерді өңдеу және талдау\n(23–29 мин)", "te": ["Есептеуге және график салуға көмектеседі, қателікті бағалауға назар аударады.", "Әр қадамды негіздеуді сұрайды."], "su": ["3) Суретте екі нүктедегі v₁ және v₂ векторларын және Δv = v₂ − v₁ векторын салып, a бағыты туралы қорытынды жасайды."], "as_": ["Дескриптор бойынша критериалды бағалау: «жылдамдық пен үдеуді есептеп, үдеу бағытын негіздейді». Топ ішінде есептеулерді өзара тексеру."], "re": ["Калькулятор, миллиметрлік қағаз, жұмыс парағы."]}, {"st": "Зерттеу жұмысы\nҚолдану\n(29–32 мин)", "te": ["Деңгейлер бойынша тапсырмалар ұсынады (саралау): базалық — үлгі бойынша; жоғары — өз бетінше шешім іздеу.", "Жауаптарды эталон бойынша тексереді."], "su": ["4) Есептер шығарады: дөңгелек, минуттық тілше ұшы, жер серігі, Жердің экватордағы нүктелері.", "Базалық деңгей: есептерді үлгі бойынша шығарады. Жоғары деңгей: Периоды бірдей болғанда осьтен R және 2R қашықтықтағы дискі нүктелерінің үдеулерін салыстыру."], "as_": ["Формативті: эталон бойынша тексеру, мұғалімнің кері байланысы."], "re": ["Есеп карточкалары, жауаптар эталоны."]}, {"st": "Талқылау және қорытынды\n(32–40 мин)", "te": ["Топтардың баяндамасын ұйымдастырады (1–1,5 мин), нақтылаушы сұрақтар қояды.", "Нәтижені гипотезамен салыстыруға көмектеседі, қорытындыны жинақтайды."], "su": ["Топтар кестені, графикті немесе есептеуді таныстырады; нәтижені гипотезамен салыстырады.", "Қорытынды тұжырымдайды: v = 2πR/T = 2πRν; a = v²/R = 4π²R/T²; a векторы шеңбер центріне бағытталған."], "as_": ["«Екі жұлдыз және тілек» өзара бағалау; қорғау критерийлері бойынша мұғалімнің бағасы."], "re": ["Жұмыс парақтары, тақта немесе проектор, өзара бағалау парағы."]}, {"st": "Сабақтың соңы\n(40–45 мин)", "te": ["Зерттеу сұрағына оралады, сабақ қорытындысын шығарады.", "Рефлексия ұйымдастырады, критерийлер бойынша баға қояды."], "su": ["Рефлексия жасайды: «Нені зерттедік? Не шықты? Не қиындық туғызды? Әрі қарай нені зерттегіңіз келеді?»", "Өз жұмысын табыс критерийлері бойынша бағалайды."], "as_": ["«Табыс баспалдағы» өзін-өзі бағалау; критерийлер бойынша баллдарды қою."], "re": ["Стикерлер, рефлексия парағы."]}], "tables": [{"t": "Жүктің айналуы", "cols": [{"h": "R, м", "key": "R", "calc": null, "text": false, "dec": 3}, {"h": "N, айналым", "key": "N", "calc": null, "text": false, "dec": 3}, {"h": "t, с", "key": "t", "calc": null, "text": false, "dec": 3}, {"h": "T = t/N, с", "key": null, "calc": "c ырлық центрін ілу тәсілімен (отвес) табады.", "Базалық деңгей: есептерді үлгі бойынша шығарады. Жоғары деңгей: Қандай үдеумен төмен қозғалғанда дене салмағы екі есе азаяды?"], "as_": ["Формативті: эталон бойынша тексеру, мұғалімнің кері байланысы."], "re": ["Есеп карточкалары, жауаптар эталоны."]}, {"st": "Талқылау және қорытынды\n(32–40 мин)", "te": ["Топтардың баяндамасын ұйымдастырады (1–1,5 мин), нақтылаушы сұрақтар қояды.", "Нәтижені гипотезамен салыстыруға көмектеседі, қорытындыны жинақтайды."], "su": ["Топтар кестені, графикті немесе есептеуді таныстырады; нәтижені гипотезамен салыстырады.", "Қорытынды тұжырымдайды: Салмақ — дененің тірекке немесе аспаға әсер ету күші; P = m(g + a) жоғары үдегенде, P = m(g − a) төмен үдегенде; ауырлық центрі — ауырлық күшінің түсу нүктесі."], "as_": ["«Екі жұлдыз және тілек» өзара бағалау; қорғау критерийлері бойынша мұғалімнің бағасы."], "re": ["Жұмыс парақтары, тақта немесе проектор, өзара бағалау парағы."]}, {"st": "Сабақтың соңы\n(40–45 мин)", "te": ["Зерттеу сұрағына оралады, сабақ қорытындысын шығарады.", "Рефлексия ұйымдастырады, критерийлер бойынша баға қояды."], "su": ["Рефлексия жасайды: «Нені зерттедік? Не шықты? Не қиындық туғызды? Әрі қарай нені зерттегіңіз келеді?»", "Өз жұмысын табыс критерийлері бойынша бағалайды."], "as_": ["«Табыс баспалдағы» өзін-өзі бағалау; критерийлер бойынша баллдарды қою."], "re": ["Стикерлер, рефлексия парағы."]}], "tables": [{"t": "Лифтідегі салмақ", "cols": [{"h": "Қозғалыс", "key": "name", "calc": null, "text": true, "dec": 3}, {"h": "m, кг", "key": "m", "calc": null, "text": false, "dec": 3}, {"h": "a, м/с² (жоғары +)", "key": "a", "calc": null, "text": false, "dec": 3}, {"h": "P = m(g + a), Н (есеп)", "key": null, "calc": "c2*(9.8+c3)", "text": false, "dec": 1}, {"h": "Таразы бойынша P, Н", "key": "P", "calc": null, "text": false, "dec": 3}]}], "sims": ["weight", "cog"], "topic": "weight", "q_no": 1}, {"n": 8, "t": "Көкжиекке бұрышпен және горизонталь бағытта дененің ауырлық күші әсерінен бастапқы жылдамдықпен қозғалуы", "ty": "Э", "q": "Горизонталь және бұрышпен лақтырылған дененің ұшу қашықтығы неге тәуелді?", "h": "Қашықтық бастапқы жылдамдық пен биіктік артқанда өседі; бұрышпен лақтырғанда ең үлкен қашықтық 45° кезінде.", "eq": "Ұшы көлденең науа, шарик, сызғыш, қағаз және көшірме қағазы, штатив, калькулятор.", "r": "t = √(2H/g) тек H-қа тәуелді; L = v₀√(2H/g); бұрышпен лақтырғанда L ең үлкен мәні α = 45° кезінде.", "steps": ["Науаны үстел жиегіне бекітіп, H биіктігін өлшейді; шарикті бір нүктеден жібереді, көшірме қағаз бойынша L қашықтығын табады (5 тәжірибе).", "Науадағы старт биіктігін өзгертіп (v₀ өзгереді) қайталайды, L жазады.", "t = √(2H/g) және v₀ = L/t есептейді; екі старт үшін v₀ салыстырады.", "Бұрышпен лақтыру: L = v₀² sin2α/g формуласымен α = 30°, 45°, 60° үшін есептейді (v₀ = 10 м/с болғанда ≈ 8,8; 10,2; 8,8 м) және салыстырады."], "hook": "Допты көлденең лақтырып, сол биіктіктен екінші допты бір мезгілде жібересіз. Олар бір мезгілде түседі! Біреуі алға да ұшса, бұл қалай болады?", "head": [["Бөлім", "Күштер. Қысым"], ["Сабақтың тақырыбы", "Көкжиекке бұрышпен және горизонталь бағытта дененің ауырлық күші әсерінен бастапқы жылдамдықпен қозғалуы"], ["Сабақтың түрі мен формасы", "Эксперименттік есептер шығару · топтық зерттеу жұмысы"], ["Оқу бағдарламасына сәйкес оқыту мақсаттары", "Күштердің (ауырлық, серпімділік, үйкеліс) әсері мен қысымды зерттеу; күштерді, ауырлық центрін және қысымды тәжірибе мен есептеу арқылы анықтау."], ["Сабақтың мақсаттары", "Горизонталь және көкжиекке бұрышпен лақтырылған дененің ұшу қашықтығы мен уақыты неге тәуелді екенін анықтау."], ["Табыс критерийлері", ["Оқушы:", "• гипотеза тұжырымдайды және зерттеу жоспарын құрады;", "• v₀ екі мәнінде шариктің ұшу қашықтығын өлшейді", "• ұшу уақыты мен бастапқы жылдамдықты есептейді", "• алынған деректерге сүйеніп қорытынды жасайды және топ нәтижесін ұсынады."]]], "stages": [{"st": "Сабақтың басы\n(0–5 мин)", "te": ["Оқушылармен амандасады, дайындықты және топ құрамын тексереді (1 мин).", "Проблемалық жағдай туғызады (мұғалімнің сөзі): Допты көлденең лақтырып, сол биіктіктен екінші допты бір мезгілде жібересіз. Олар бір мезгілде түседі! Біреуі алға да ұшса, бұл қалай болады? (2 мин)", "Оқушылармен бірге зерттеу сұрағы мен гипотезаны тұжырымдайды, мақсаттармен және табыс критерийлерімен таныстырады (2 мин)."], "su": ["Жұмысқа дайындалады, 3–4 адамнан топқа отырады, рөлдерді бөледі.", "Болжам айтады; «Горизонталь және бұрышпен лақтырылған дененің ұшу қашықтығы неге тәуелді?» сұрағын және гипотезаны тұжырымдайды: Қашықтық бастапқы жылдамдық пен биіктік артқанда өседі; бұрышпен лақтырғанда ең үлкен қашықтық 45° кезінде.", "Мақсат пен табыс критерийлерін жұмыс парағына жазады."], "as_": ["Формативті: мұғалімнің ауызша кері байланысы; «Бас бармақ» (жұмысқа дайындық)."], "re": ["Презентация немесе бейнежазба, рөл карточкалары, критерийлер парағы."]}, {"st": "Білімді өзектендіру\n(5–10 мин)", "te": ["Фронталды сұрау жүргізеді: «Дене көлденең және тік бағытта қалай қозғалады?», «H биіктіктен құлау уақытын қалай табамыз?»", "Қажетті формулалар мен ұғымдарды еске салады: Қозғалыстың осьтер бойынша жіктелуі: x бойынша бірқалыпты, y бойынша еркін құлау."], "su": ["Сұрақтарға жауап береді, формулаларды еске түсіреді.", "Зерттеуге қажетті формулаларды жұмыс парағына жазады."], "as_": ["Формативті: фронталды сұрау, «Бағдаршам»; мұғалімнің пікірі."], "re": ["Тақта, жұмыс парағы."]}, {"st": "Зерттеу жұмысы\nЖоспарлау және нұсқаулық\n(10–13 мин)", "te": ["Жабдықты және жұмыс парақтарын таратады.", "Қауіпсіздік техникасы бойынша нұсқау береді.", "Зерттеу жоспарын құруға көмектеседі: нені, немен өлшейміз, неше тәжірибе, деректерді қалай жазамыз."], "su": ["Топта зерттеу жоспарын талқылайды.", "Міндеттерді бөліп, жоспар мен деректер кестесін жұмыс парағына жазады."], "as_": ["Мұғалімнің топтар жұмысын бақылауы."], "re": ["Жабдық: Ұшы көлденең науа, шарик, сызғыш, қағаз және көшірме қағазы, штатив, калькулятор."]}, {"st": "Зерттеу жұмысы\nДеректер жинау\n(13–23 мин)", "te": ["Топтарға кеңес береді, қауіпсіздік техникасының сақталуын және өлшеу дәлдігін бақылайды.", "Дайын жауап бермей, жетелеуші сұрақтар қояды."], "su": ["1) Науаны үстел жиегіне бекітіп, H биіктігін өлшейді; шарикті бір нүктеден жібереді, көшірме қағаз бойынша L қашықтығын табады (5 тәжірибе).", "2) Науадағы старт биіктігін өзгертіп (v₀ өзгереді) қайталайды, L жазады."], "as_": ["Дескриптор бойынша критериалды бағалау: «v₀ екі мәнінде шариктің ұшу қашықтығын өлшейді». Бағалау парағы бойынша бақылау."], "re": ["Жабдық, жұмыс парағы, деректерді жазу кестесі."]}, {"st": "Зерттеу жұмысы\nДеректерді өңдеу және талдау\n(23–29 мин)", "te": ["Есептеуге және график салуға көмектеседі, қателікті бағалауға назар аударады.", "Әр қадамды негіздеуді сұрайды."], "su": ["3) t = √(2H/g) және v₀ = L/t есептейді; екі старт үшін v₀ салыстырады."], "as_": ["Дескриптор бойынша критериалды бағалау: «ұшу уақыты мен бастапқы жылдамдықты есептейді». Топ ішінде есептеулерді өзара тексеру."], "re": ["Калькулятор, миллиметрлік қағаз, жұмыс парағы."]}, {"st": "Зерттеу жұмысы\nҚолдану\n(29–32 мин)", "te": ["Деңгейлер бойынша тапсырмалар ұсынады (саралау): базалық — үлгі бойынша; жоғары — өз бетінше шешім іздеу.", "Жауаптарды эталон бойынша тексереді."], "su": ["4) Бұрышпен лақтыру: L = v₀² sin2α/g формуласымен α = 30°, 45°, 60° үшін есептейді (v₀ = 10 м/с болғанда ≈ 8,8; 10,2; 8,8 м) және салыстырады.", "Базалық деңгей: есептерді үлгі бойынша шығарады. Жоғары деңгей: Шариктің жерге түсер мезеттегі жылдамдығын (модулі және көкжиекпен бұрышы) табу."], "as_": ["Формативті: эталон бойынша тексеру, мұғалімнің кері байланысы."], "re": ["Есеп карточкалары, жауаптар эталоны."]}, {"st": "Талқылау және қорытынды\n(32–40 мин)", "te": ["Топтардың баяндамасын ұйымдастырады (1–1,5 мин), нақтылаушы сұрақтар қояды.", "Нәтижені гипотезамен салыстыруға көмектеседі, қорытындыны жинақтайды."], "su": ["Топтар кестені, графикті немесе есептеуді таныстырады; нәтижені гипотезамен салыстырады.", "Қорытынды тұжырымдайды: t = √(2H/g) тек H-қа тәуелді; L = v₀√(2H/g); бұрышпен лақтырғанда L ең үлкен мәні α = 45° кезінде."], "as_": ["«Екі жұлдыз және тілек» өзара бағалау; қорғау критерийлері бойынша мұғалімнің бағасы."], "re": ["Жұмыс парақтары, тақта немесе проектор, өзара бағалау парағы."]}, {"st": "Сабақтың соңы\n(40–45 мин)", "te": ["Зерттеу сұрағына оралады, сабақ қорытындысын шығарады.", "Рефлексия ұйымдастырады, критерийлер бойынша баға қояды."], "su": ["Рефлексия жасайды: «Нені зерттедік? Не шықты? Не қиындық туғызды? Әрі қарай нені зерттегіңіз келеді?»", "Өз жұмысын табыс критерийлері бойынша бағалайды."], "as_": ["«Табыс баспалдағы» өзін-өзі бағалау; критерийлер бойынша баллдарды қою."], "re": ["Стикерлер, рефлексия парағы."]}], "tables": [{"t": "Биіктіктен лақтыру", "cols": [{"h": "H, м", "key": "H", "calc": null, "text": false, "dec": 3}, {"h": "L, м", "key": "L", "calc": null, "text": false, "dec": 3}, {"h": "t = √(2H/g), с", "key": null, "calc": "Math.sqrt(2*c1/9.8)", "text": false, "dec": 3}, {"h": "v₀ = L/t, м/с", "key": null, "calc": "c2/Math.sqrt(2*c1/9.8)", "text": false, "dec": 3}]}, {"t": "Бұрышпен лақтыру (есеп)", "cols": [{"h": "α, °", "key": "alpha", "calc": null, "text": false, "dec": 3}, {"h": "v₀, м/с", "key": "v0", "calc": null, "text": false, "dec": 3}, {"h": "L = v₀²sin2α/g, м", "key": null, "calc": "c2*c2*Math.sin(2*c1*Math.PI/180)/9.8", "text": false, "dec": 3}]}], "sims": ["proj"], "topic": "proj", "q_no": 1}, {"n": 9, "t": "Серпімділік күші. Гук заңы. Үйкеліс күші. Үйкеліс коэффициенті", "ty": "П", "q": "Серіппенің ұзаруы күшке қалай тәуелді және үйкеліс күші білеуше салмағына қалай тәуелді?", "h": "Ұзару күшке пропорционал, үйкеліс күші қалыпты қысым күшіне пропорционал.", "eq": "Серіппе, жүктер жиыны, сызғыш, штатив, динамометр, жүктері бар ағаш білеуше.", "r": "F(Δl) графигі — координат басы арқылы өтетін түзу, k — оның көлбеуі; Fүйк ∝ N, μ коэффициенті — Fүйк(N) графигінің көлбеуі.", "steps": ["Серіппеге 1–5 жүк іліп нша критериалды бағалау: «иінтіректі тепе-теңдікке келтіріп, иықтарды өлшейді». Бағалау парағы бойынша бақылау."], "re": ["Жабдық, жұмыс парағы, деректерді жазу кестесі."]}, {"st": "Зерттеу жұмысы\nДеректерді өңдеу және талдау\n(23–29 мин)", "te": ["Есептеуге және график салуға көмектеседі, қателікті бағалауға назар аударады.", "Әр қадамды негіздеуді сұрайды."], "su": ["3) Әр тәжірибе үшін P = mg·l₂/l₁ және орташа мәнін есептейді."], "as_": ["Дескриптор бойынша критериалды бағалау: «дене салмағын есептеп, динамометрмен салыстырады». Топ ішінде есептеулерді өзара тексеру."], "re": ["Калькулятор, миллиметрлік қағаз, жұмыс парағы."]}, {"st": "Зерттеу жұмысы\nҚолдану\n(29–32 мин)", "te": ["Деңгейлер бойынша тапсырмалар ұсынады (саралау): базалық — үлгі бойынша; жоғары — өз бетінше шешім іздеу.", "Жауаптарды эталон бойынша тексереді."], "su": ["4) Салмақты динамометрмен өлшеп, нәтижелерді салыстырады.", "Базалық деңгей: есептерді үлгі бойынша шығарады. Жоғары деңгей: Денені ауада және суда иінтірекпен өлшеп, оның тығыздығын анықтау."], "as_": ["Формативті: эталон бойынша тексеру, мұғалімнің кері байланысы."], "re": ["Есеп карточкалары, жауаптар эталоны."]}, {"st": "Талқылау және қорытынды\n(32–40 мин)", "te": ["Топтардың баяндамасын ұйымдастырады (1–1,5 мин), нақтылаушы сұрақтар қояды.", "Нәтижені гипотезамен салыстыруға көмектеседі, қорытындыны жинақтайды."], "su": ["Топтар кестені, графикті немесе есептеуді таныстырады; нәтижені гипотезамен салыстырады.", "Қорытынды тұжырымдайды: P = mgl₂/l₁; әртүрлі иықтар үшін мәндер қателік шегінде сәйкес келеді және динамометр көрсеткішіне жақын."], "as_": ["«Екі жұлдыз және тілек» өзара бағалау; қорғау критерийлері бойынша мұғалімнің бағасы."], "re": ["Жұмыс парақтары, тақта немесе проектор, өзара бағалау парағы."]}, {"st": "Сабақтың соңы\n(40–45 мин)", "te": ["Зерттеу сұрағына оралады, сабақ қорытындысын шығарады.", "Рефлексия ұйымдастырады, критерийлер бойынша баға қояды."], "su": ["Рефлексия жасайды: «Нені зерттедік? Не шықты? тка (сатының биіктігі және саны), секундомер, таразы немесе белгілі масса, калькулятор."]}, {"st": "Зерттеу жұмысы\nДеректер жинау\n(13–23 мин)", "te": ["Топтарға кеңес береді, қауіпсіздік техникасының сақталуын және өлшеу дәлдігін бақылайды.", "Дайын жауап бермей, жетелеуші сұрақтар қояды."], "su": ["1) Көтерілу биіктігін h өлшейді (саты биіктігі × саны).", "2) Бір оқушы жай жүріспен және жүгіріспен көтеріледі; қалғандары t уақытын өлшейді."], "as_": ["Дескриптор бойынша критериалды бағалау: «көтерілу биіктігі мен уақытты өлшеп, жұмыс пен қуатты есептейді». Бағалау парағы бойынша бақылау."], "re": ["Жабдық, жұмыс парағы, деректерді жазу кестесі."]}, {"st": "Зерттеу жұмысы\nДеректерді өңдеу және талдау\n(23–29 мин)", "te": ["Есептеуге және график салуға көмектеседі, қателікті бағалауға назар аударады.", "Әр қадамды негіздеуді сұрайды."], "su": ["3) Әр жағдай үшін A = mgh жұмысын және N = A/t қуатын есептеп, салыстырады."], "as_": ["Дескриптор бойынша критериалды бағалау: «көтерілудің әртүрлі жылдамдығындағы қуаттарды салыстырады». Топ ішінде есептеулерді өзара тексеру."], "re": ["Калькулятор, миллиметрлік қағаз, жұмыс парағы."]}, {"st": "Зерттеу жұмысы\nҚолдану\n(29–32 мин)", "te": ["Деңгейлер бойынша тапсырмалар ұсынады (саралау): базалық — үлгі бойынша; жоғары — өз бетінше шешім іздеу.", "Жауаптарды эталон бойынша тексереді."], "su": ["4) ПӘК-ке есептер шығарады: көтергіш кран, көлбеу жазықтық.", "Базалық деңгей: есептерді үлгі бойынша шығарады. Жоғары деңгей: Жұмсалған энергия пайдалы жұмыстан шамамен 4 есе артық болса, көтерілу кезіндегі адамның ПӘК-ін анықтау."], "as_": ["Формативті: эталон бойынша тексеру, мұғалімнің кері байланысы."], "re": ["Есеп карточкалары, жауаптар эталоны."]}, {"st": "Талқылау және қорытынды\n(32–40 мин)", "te": ["Топтардың баяндамасын ұйымдастырады (1–1,5 мин), нақтылаушы сұрақтар қояды.", "Нәтижені гипотезамен салыстыруға көмектеседі, қорытындыны жинақтайды."], "su": ["Топтар кестені, графикті немесе есептеуді таныстырады; нәтижені ги алыстырады.", "Басқа сығылу үшін қайталап, қорытынды жасайды."], "hook": "Қаламсап серіппесін қысып жібереміз — ол «атылады». Стерженьге кинетикалық энергия қайдан келді? Оны есептей аламыз ба?", "head": [["Бөлім", "Сақталу заңдары. Жұмыс. Қуат"], ["Сабақтың тақырыбы", "Серпімділік күшінің жұмысын дененің кинетикалық энергиясының өзгерісімен салыстыру"], ["Сабақтың түрі мен формасы", "Проблемалық есептер шығару · топтық зерттеу жұмысы"], ["Оқу бағдарламасына сәйкес оқыту мақсаттары", "Импульс пен энергияның сақталу заңдарын қолдану; қарапайым механизмдердің жұмысын, қуатын және ПӘК-ін анықтау."], ["Сабақтың мақсаттары", "Серіппенің серпімділік күші жұмысын дененің кинетикалық энергиясының өзгерісімен салыстыру."], ["Табыс критерийлері", ["Оқушы:", "• гипотеза тұжырымдайды және зерттеу жоспарын құрады;", "• қысылу x-ті және шариктің ұшу қашықтығын өлшейді", "• A = kx²/2 пен ΔEк салыстырып, шығынды бағалайды", "• алынған деректерге сүйеніп қорытынды жасайды және топ нәтижесін ұсынады."]]], "stages": [{"st": "Сабақтың басы\n(0–5 мин)", "te": ["Оқушылармен амандасады, дайындықты және топ құрамын тексереді (1 мин).", "Проблемалық жағдай туғызады (мұғалімнің сөзі): Қаламсап серіппесін қысып жібереміз — ол «атылады». Стерженьге кинетикалық энергия қайдан келді? Оны есептей аламыз ба? (2 мин)", "Оқушылармен бірге зерттеу сұрағы мен гипотезаны тұжырымдайды, мақсаттармен және табыс критерийлерімен таныстырады (2 мин)."], "su": ["Жұмысқа дайындалады, 3–4 адамнан топқа отырады, рөлдерді бөледі.", "Болжам айтады; «Серіппенің серпімділік күші жұмысы шариктің кинетикалық энергиясының өзгерісіне тең бе?» сұрағын және гипотезаны тұжырымдайды: kx²/2 жұмысы шариктің кинетикалық энергиясына шамамен тең, бір бөлігі үйкеліске кетеді.", "Мақсат пен табыс критерийлерін жұмыс парағына жазады."], "as_": ["Формативті: мұғалімнің ауызша кері байланысы; «Бас бармақ» (жұмысқа дайындық)."], "re": ["Презентация немесе бейнежазба, рөл карточкалары, критерийлер парағы."]}, {"st": "Білімді өзектендір function Flight(){
 const f={on:false,t:0,L:null,Lm:null,trail:[],prev:[],H:1,v0:0,al:0,tL:0,x:0,y:0};
 f.start=(v0,al,H)=>{f.prev=f.trail.slice();f.trail=[];f.v0=v0;f.al=al*Math.PI/180;f.H=H;f.t=0;f.on=true;f.L=null;f.Lm=null;
  const vy=v0*Math.sin(f.al);f.tL=(vy+Math.sqrt(vy*vy+2*G*H))/G;f.Lr=v0*Math.cos(f.al)*f.tL;f.x=0;f.y=H};
 f.step=dt=>{if(!f.on)return;f.t=Math.min(f.tL,f.t+dt);f.x=f.v0*Math.cos(f.al)*f.t;f.y=f.H+f.v0*Math.sin(f.al)*f.t-G*f.t*f.t/2;f.trail.push([f.x,f.y]);
  if(f.t>=f.tL){f.on=false;f.L=f.Lr;f.Lm=f.Lr+gauss()*.004}};
 f.draw=(ctx,w,hh,x0,sc,fy,Hshow)=>{const cs=css,H=Hshow??f.H;
  rect(ctx,0,fy,w,hh-fy,cs('--soft'));line(ctx,0,fy,w,fy,cs('--ink'),2);
  for(let m=0;x0+m*sc<w-10;m+=.1){const x=x0+m*sc,big=Math.abs(m*2-Math.round(m*2))<1e-6;if(Math.round(m*10)%5===0||big){line(ctx,x,fy,x,fy+(Math.round(m*10)%10===0?12:7),cs('--muted'))}
   if(Math.round(m*10)%10===0)txt(ctx,Math.round(m)+' м',x,fy+25,{a:'center',s:11,c:cs('--muted')})}
  rect(ctx,0,fy-H*sc,x0,H*sc,cs('--card'),cs('--ink'));txt(ctx,'H = '+fmt(H,2)+' м',8,fy-H*sc/2,{s:12,b:1});
  const tr=(T,c,w2)=>{if(T.length<2)return;ctx.beginPath();ctx.strokeStyle=c;ctx.lineWidth=w2;ctx.setLineDash([4,4]);T.forEach((p,i)=>{const X=x0+p[0]*sc,Y=fy-p[1]*sc;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.stroke();ctx.setLineDash([])};
  tr(f.prev,cs('--muted'),1);tr(f.trail,cs('--c1'),1.5);
  circ(ctx,x0+f.x*sc,fy-f.y*sc,7,cs('--c2'),cs('--ink'));
  if(f.L!=null){const X=x0+f.L*sc;line(ctx,X,fy-30,X,fy,cs('--c2'),2);txt(ctx,'L = '+fmt(f.Lm,2)+' м',X,fy-36,{a:'center',s:13,b:1,c:cs('--c2')})}};
 return f;
}

 while(u2===u1)u2=pick();

 const c=Ctl(host);
 c.select(L('Сосуд 1','1-ыдыс'),sel,v=>l1=v);

 c.btn(L('Записать опыт: сосуд 1','Тәжірибені жазу: 1-ыдыс'),()=>rec(l1),'pri');

 const o=c.out(L('Манометр','Манометр'));

 let m=60,n=18,way='w',t=0,run=false,res=null,show=false,tt=0,noise=true;
 const c=Ctl(host);
 c.slider(L('Масса ученика, кг','Оқушы массасы, кг'),40,100,1,m,v=>{m=v;rs()});
 c.slider(L('Ступенек (по 17 см)','Сатылар (17 см)'),10,25,1,n,v=>{n=v;rs()});
 c.select(L('Способ','Тәсіл'),[['w',L('шагом','жай жүріспен')],['r',L('бегом','жүгіріп')]],v=>{way=v;rs()});
 c.check(L('Погрешность секундомера','Секундомер қателігі'),true,v=>noise=v);
 c.check(L('Показать работу и мощность (проверка)','Жұмыс пен қуатты көрсету (тексеру)'),false,v=>show=v);
 c.btn(L('Подъём','Көтерілу'),()=>{rs();tt=n*(way==='w'?.62:.34)*(1+gauss()*.03);run=true},'pri');
 c.btn(L('Записать','Жазу'),()=>{if(!res)return toast(L('Сначала выполните подъём','Алдымен көтеріліңіз'));emit({name:way==='w'?L('шагом','жай жүріспен'):L('бегом','жүгіріп'),m,h:r2(n*.17,2),t:r2(res,1)})});
 const o=c.out(L('Время','Уақыт')),op=c.out(L('Расчёт','Есеп'));
 function rs(){run=false;t=0;res=null;o('–')}
 rs();
 loop(host,dt=>{if(run){t+=dt;if(t>=tt){t=tt;run=false;res=tt+(noise?gauss()*.1:0);o(fmt(res,1)+' с')}}
  const cs=css;ctx.clearRect(0,0,w,H);const sw=560/n,sh=Math.min(14,240/n),x0=100,y0=290;
  ctx.beginPath();ctx.moveTo(x0,y0);for(let i=0;i<n;i++){ctx.lineTo(x0+i*sw,y0-(i+1)*sh);ctx.lineTo(x0+(i+1)*sw,y0-(i+1)*sh)}ctx.lineTo(x0+n*sw,y0);ctx.closePath();ctx.fillStyle=cs('--soft');ctx.fill();ctx.strokeStyle=cs('--ink');ctx.lineWidth=2;ctx.stroke();
  const f=tt?t/tt:0,px=x0+f*n*sw,py=y0-f*n*sh-18;circ(ctx,px,py,9,cs('--c2'),cs('--ink'));line(ctx,px,py+9,px,py+22,cs('--ink'),2);
  line(ctx,x0+n*sw+14,y0,x0+n*sw+14,y0-n*sh,cs('--c1'),2);txt(ctx,'h',x0+n*sw+20,y0-n*sh/2,{s:13,b:1,c:cs('--c1')});
  op(show?`A=${fmt(m*G*n*.17,0)} ${L('Дж','Дж')}${res?`, N=${fmt(m*G*n*.17/res,0)} ${L('Вт','Вт')}`:''}`:'?')});
};

SIMT.energy=['Горка, стол и падение шарика','Төбе, үстел және шариктің құлауы'];
SIMS.energy=(host,emit)=>{
 const{ctx,w,h:H}=mkCanvas(host,760,380);
 const F=Flight();let hh=.25,Ht=.8,m=.03,loss=.05,kind='ball',s=0,v=0,run=false,ph=0,show=false,vexit=0,done=false;
 const c=Ctl(host);
 c.slider(L('Высота старта h, м','Старт биіктігі h, м'),.05,.5,.01,hh,x=>{hh=x;rs()},x=>fmt(x,2));
 c.slider(L('Высота стола H, м','Үстел биіктігі H, м'),.5,1.2,.05,Ht,x=>{Ht=x;rs()},x=>fmt(x,2));
 c.slider(L('Масса, г','Масса, г'),10,100,5,30,x=>{m=x/1000;rs()});
 c.select(L('Тело','Дене'),[['ball',L('Шарик (катится)','Шарик (домалайды)')],['puck',L('Брусок (скользит)','Білеуше (сырғиды)')]],x=>{kind=x;rs()});
 c.slider(L('Потери на трение, %','Үйкеліске шығын, %'),0,20,1,5,x=>{loss=x/100;rs()});
 c.check(L('Показать энергии (проверка)','Энергияларды көрсету (тексеру)'),true,x=>show=x);
 c.btn(L('Пуск','Жіберу'),()=>{rs();run=true},'pri');c.btn(L('Сброс','Қайта'),()=>rs());
 c.btn(L('Записать опыт','Тәжірибені жазу'),()=>{if(F.Lm==null)return toast(L('Дождитесь падения','Құлауын күтіңіз'));emit({h:r2(hh,2),m:Math.round(m*1000),L:r2(F.Lm,2),H:r2(Ht,2)})},'pri');
 const o=c.out(L('Скорость на краю','Шеттегі жылдамдық'));
 const f_=()=>(kind==='ball'?5/7:1)*(1-loss);
 function rs(){s=0;v=0;run=false;ph=0;done=false;F.on=false;F.trail=[];F.prev=[];F.L=null;F.Lm=null;F.x=0;F.y=Ht;o('–')}
 rs();
 loop(host,dt=>{
  const slopeLen=Math.max(.2,hh/Math.sin(.5));const th=Math.asin(Math.min(.95,hh/slopeLen));
  if(run&&ph===0){const a=G*f_()*Math.sin(th);v+=a*dt;s+=v*dt;if(s>=slopeLen){ph=1;vexit=Math.sqrt(2*G*hh*f_());o(fmt(vexit,2)+' м/с');run=false;F.start(vexit,0,Ht);}}
  F.step(dt);
  const cs=css;ctx.clearRect(0,0,w,H);const sc=Math.min(90,Math.min(250/Ht,(300)/(hh+Ht+.3)));const fy=345,x0=330;
  F.draw(ctx,w,H,x0,sc,fy,Ht);
  const ty=fy-Ht*sc;ctx.beginPath();ctx.moveTo(x0-slopeLen*Math.cos(th)*sc-40,ty);ctx.lineTo(x0-slopeLen*Math.cos(th)*sc-40,ty-hh*sc);ctx.lineTo(x0,ty);ctx.fillStyle=cs('--soft');ctx.fill();ctx.strokeStyle=cs('--ink');ctx.lineWidth=2;ctx.stroke();
  const sx=x0-slopeLen*Math.cos(th)*sc-40,sy=ty-hh*sc;
  if(ph===0){const d=Math.min(s,slopeLen);const bx=sx+d*Math.cos(th)*sc*(slopeLen*Math.cos(th)*sc+40)/(slopeLen*Math.cos(th)*sc)*0+d*Math.cos(th)*sc*((x0-sx)/(slopeLen*Math.cos(th)*sc)),by=sy+d*Math.sin(th)*sc*(hh*sc/(slopeLen*Math.sin(th)*sc));circ(ctx,bx,by-8,8,cs('--c2'),cs('--ink'))}
  /* энергии */
  const E0=m*G*hh*1000;const prog=ph===0?Math.min(1,s/slopeLen):1;const Ep=E0*(1-prog),Ek=E0*prog*f_(),Lo=E0-Ep-Ek;
  if(show){const bx=40,by=130,bw=26;[[Ep,'Eп',cs('--c1')],[Ek,'Eк',cs('--c2')],[Lo,L('потери','шығын'),cs('--muted')]].forEach(([e,l,col],i)=>{const hb=E0?e/E0*90:0;rect(ctx,bx+i*54,by-hb,bw,hb,col);txt(ctx,l,bx+i*54+bw/2,by+14,{a:'center',s:11});txt(ctx,fmt(e,1),bx+i*54+bw/2,by-hb-4,{a:'center',s:10,m:1})});txt(ctx,L('мДж','мДж'),bx,22,{s:11,c:cs('--muted')})}
 });
};

  /* динамометр */
  const dx=px+26,dy=18;rect(ctx,dx-14,dy,28,120,cs('--card'),cs('--ink'));for(let i=0;i<=10;i++){line(ctx,dx-14,dy+8+i*10,dx-6,dy+8+i*10,cs('--ink'));txt(ctx,i,dx-18,dy+12+i*10,{a:'right',s:10,m:1})}
  const val=direct?lim+1:(F!=null?F*upk:0);const yy=dy+8+Math.min(val,lim)*10;line(ctx,dx-14,yy,dx+14,yy,cs('--bad'),3);
  txt(ctx,L('Н','Н'),dx+22,dy+14,{s:11});

 c.slider(L('Амплитуда (маятник), °','Амплитуда (маятник), °'),2,60,1,A,v=>{A=v;rs()});

const parseNum=s=>{const x=parseFloat(String(s).replace(',','.').replace(/\s/g,''));return isFinite(x)?x:NaN};
const fcell=(x,dec)=>{if(!isFinite(x))return '';if(dec===0)return String(Math.round(x));let s=x.toPrecision(3);return s.replace('.',',')};

function TableView(n,spec,idx){
 const sk=keyOf(n,'t'+idx);let rows=store.get(sk)||Array.from({length:rows_default},()=>spec.cols.map(()=>''));
 const nc=spec.cols.length;
 const fns=spec.cols.map(c=>{if(!c.calc)return null;try{return new Function(...Array.from({length:nc},(_,i)=>'c'+(i+1)),'return '+c.calc)}catch(e){showErr(e);return null}});
 const wrap=h('div',{class:'card'});

 wrap.append(h('h3',{style:'margin:0 0 8px;font-size:15px'},spec.t),scroll,tools);
 let cells=[];
 function save(){store.set(sk,rows)}
 function render(){
  tbl.innerHTML='';cells=[];
  tbl.append(h('thead',null,h('tr',null,h('th',null,'№'),spec.cols.map(c=>h('th',null,c.h,c.calc?h('div',{class:'note',style:'font-weight:400'},'('+U('calc')+')'):null)))));
  const tb=h('tbody');rows.forEach((r,ri)=>{const tr=h('tr',null,h('td',{class:'rn'},ri+1));const rc=[];
   spec.cols.forEach((c,ci)=>{if(c.calc){const td=h('td',{class:'calc'});rc.push(td);tr.append(td)}
    else{const inp=h('input',{type:'text',inputmode:c.text?'text':'decimal','aria-label':c.h+', '+U('row')+' '+(ri+1)});inp.value=r[ci]||'';
     inp.oninput=()=>{rows[ri][ci]=inp.value;save();recalc()};rc.push(inp);tr.append(h('td',null,inp))}});
   cells.push(rc);tb.append(tr)});
  tbl.append(tb);const avg=h('tr',{class:'avg'},h('td',null,'x̄'));spec.cols.forEach(()=>avg.append(h('td')));tbl.append(h('tfoot',null,avg));
  recalc()}
 function recalc(){
  const vals=[];
  rows.forEach((r,ri)=>{const v=spec.cols.map((c,ci)=>c.calc?NaN:(c.text?NaN:parseNum(r[ci])));
   spec.cols.forEach((c,ci)=>{if(c.calc&&fns[ci]){try{v[ci]=fns[ci](...v)}catch(e){v[ci]=NaN};const td=cells[ri][ci];td.textContent=fcell(v[ci],c.dec);}});vals.push(v)});
  const tr=tbl.querySelector('tfoot tr');if(!tr)return;
  spec.cols.forEach((c,ci)=>{const td=tr.children[ci+1];if(c.text){td.textContent='';return}const xs=vals.map(v=>v[ci]).filter(isFinite);td.textContent=xs.length>=2?fcell(xs.reduce((a,b)=>a+b,0)/xs.length,c.dec):''});
 }
 function toText(){return spec.t+'\n'+['№',...spec.cols.map(c=>c.h)].join('\t')+'\n'+rows.map((r,ri)=>{const v=spec.cols.map((c,ci)=>c.calc?NaN:(c.text?NaN:parseNum(r[ci])));
  const out=spec.cols.map((c,ci)=>{if(c.calc&&fns[ci]){try{v[ci]=fns[ci](...v)}catch(e){}return fcell(v[ci],c.dec)}return r[ci]||''});return [ri+1,...out].join('\t')}).filter(l=>l.split('\t').slice(1).some(x=>x)).join('\n')}
 function matchScore(snap){return spec.cols.reduce((a,c)=>a+(c.key&&snap[c.key]!==undefined&&snap[c.key]!==null?1:0),0)}
 function put(snap,opts={}){
  const keyed=spec.cols.map((c,ci)=>[c,ci]).filter(([c])=>c.key&&snap[c.key]!==undefined&&snap[c.key]!==null);
  let ri=-1;
  if(opts.merge){for(let i=rows.length-1;i>=0;i--){if(rows[i].some((x,ci)=>x&&!spec.cols[ci].calc)){if(keyed.every(([c,ci])=>!rows[i][ci]))ri=i;break}}}
  if(ri<0){ri=rows.findIndex(r=>r.every((x,ci)=>!x||spec.cols[ci].calc));if(ri<0){rows.push(spec.cols.map(()=>''));ri=rows.length-1}}
  keyed.forEach(([c,ci])=>{const v=snap[c.key];rows[ri][ci]=typeof v==='number'?String(v).replace('.',','):String(v)});
  save();render();return ri+1}

 return{el:wrap,score:matchScore,put,text:toText,spec,hasData:()=>rows.some(r=>r.some((x,ci)=>x&&!spec.cols[ci].calc))};
}
